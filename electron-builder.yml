appId: com.lecta.app
productName: Lecta
copyright: Copyright © 2026 Rui Machado

directories:
  buildResources: build
  output: release

# `files` contains only negations, so electron-builder keeps its default
# "**/*" include. That is what ships out/ — including the offline runtimes
# emitted to out/renderer/runtimes/{pyodide,sqljs} by the `lecta-runtimes`
# plugin in electron.vite.config.ts (verified present in app.asar and
# loadable from inside it).
# Do NOT add a positive glob here (e.g. "out/**"): the first positive pattern
# replaces the default include and would drop package.json and node_modules.
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!packages/*"
  - "!example-decks/*"
  - "!electron-vite.config.*"
  - "!{.eslintignore,.eslintrc*,prettier.config.*,.prettierrc*}"
  - "!{tsconfig.json,tsconfig.*.json}"

extraResources:
  # First-run demo deck. `files` excludes example-decks from the asar, so it ships
  # here instead and `src/main/ipc/demo.ts` copies it into ~/Documents on demand.
  - from: example-decks/hello-world
    to: example-decks/hello-world
    filter:
      - "**/*"
  - from: packages/mcp-server/dist
    to: mcp-server/dist
    filter:
      - "**/*"
  - from: packages/mcp-server/node_modules
    to: mcp-server/node_modules
    filter:
      - "**/*"

mac:
  artifactName: "${productName}-${version}-${arch}.${ext}"
  target:
    - target: dmg
      arch:
        - x64
        - arm64

win:
  artifactName: "${productName}-${version}-setup.${ext}"
  target:
    - target: nsis
      arch:
        - x64

linux:
  artifactName: "${productName}-${version}-${arch}.${ext}"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development

deb:
  maintainer: "Bruno Selistre <bruno.selistre@orbitplatform.ai>"
  afterInstall: build/linux/postinst.sh

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
